name: FDM-999 recover existing candidate
on:
  push:
    branches: [agent/fdm-999-recovery]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export original bytes without modifying them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fdm999-recovered"
          cp .agent/fdm999-candidate.bundle "$RUNNER_TEMP/fdm999-recovered/candidate-original.bundle"
          sha256sum .agent/fdm999-candidate.bundle
          wc -c .agent/fdm999-candidate.bundle
          git bundle list-heads .agent/fdm999-candidate.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: fdm999-original-bundle
          path: ${{ runner.temp }}/fdm999-recovered
          retention-days: 7
          if-no-files-found: error
