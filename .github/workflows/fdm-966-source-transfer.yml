name: FDM-966 source transfer
on:
  push:
    branches: [agent/fdm-966-source-transfer]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install the unchanged CI Qt dependency set
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-window qml6-module-qttest qt6-declarative-dev-tools
      - name: Package offscreen test tools (no project or credentials)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qt-portable/{bin,lib,qml,plugins}
          cp /usr/lib/qt6/bin/{qmltestrunner,qmlformat,qmllint} /tmp/qt-portable/bin/
          cp -a /usr/lib/x86_64-linux-gnu/qt6/qml/. /tmp/qt-portable/qml/
          cp -a /usr/lib/x86_64-linux-gnu/qt6/plugins/. /tmp/qt-portable/plugins/
          python3 - <<'PY'
          from pathlib import Path
          import re,shutil,subprocess
          root=Path('/tmp/qt-portable')
          # ldd lists transitive ELF dependencies. Use the container's newer
          # glibc/libstdc++; package the versioned Qt/ICU/platform dependencies.
          skip=re.compile(r'^(libc\.|libm\.|libpthread\.|librt\.|libdl\.|libstdc\+\+\.|libgcc_s\.|ld-linux)')
          binaries=list((root/'bin').iterdir())+list((root/'qml').rglob('*.so'))+list((root/'plugins').rglob('*.so'))
          for binary in binaries:
              output=subprocess.run(['ldd',str(binary)],capture_output=True,text=True).stdout
              for value in re.findall(r'=> (/[^\s]+)',output):
                  source=Path(value)
                  if not skip.match(source.name): shutil.copy2(source,root/'lib'/source.name)
          PY
          tar -C /tmp -czf /tmp/qt-portable.tar.gz qt-portable
          sha256sum /tmp/qt-portable.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: fdm966-qt-offscreen-tools
          path: /tmp/qt-portable.tar.gz
          retention-days: 1
