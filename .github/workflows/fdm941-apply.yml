name: FDM-941 source integration

on:
  push:
    branches:
      - feature/fdm-938-context-menus-local-grouping-workspace-pins
    paths:
      - scripts/fdm941_apply.py
      - .github/workflows/fdm941-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/fdm-938-context-menus-local-grouping-workspace-pins
          fetch-depth: 0
      - name: Apply CM-03 integration patch
        run: python3 scripts/fdm941_apply.py
      - name: Commit source integration and remove one-shot patcher
        run: |
          rm scripts/fdm941_apply.py .github/workflows/fdm941-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: wire FDM-941 workspace-local grouping'
          git push origin HEAD:feature/fdm-938-context-menus-local-grouping-workspace-pins
