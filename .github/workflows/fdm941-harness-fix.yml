name: FDM-941 harness fix

on:
  push:
    branches:
      - feature/fdm-938-context-menus-local-grouping-workspace-pins
    paths:
      - scripts/fdm941_harness_fix.py
      - .github/workflows/fdm941-harness-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/fdm-938-context-menus-local-grouping-workspace-pins
          fetch-depth: 0
      - name: Apply CM-03 harness fixes
        run: python3 scripts/fdm941_harness_fix.py
      - name: Commit fixes and remove one-shot scaffolding
        run: |
          set -euo pipefail
          rm scripts/fdm941_harness_fix.py .github/workflows/fdm941-harness-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: cover FDM-941 legacy host lifecycle'
          git push origin HEAD:feature/fdm-938-context-menus-local-grouping-workspace-pins
