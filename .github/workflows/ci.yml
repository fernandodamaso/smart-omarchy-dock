name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fdm942-apply:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/fdm-938-context-menus-local-grouping-workspace-pins' }}
    name: Apply FDM-942 source patch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply and verify focused CM-04 patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fdm942_prepatch.py
          python scripts/fdm942_apply.py
          node tests/test_session_pins.mjs
          node tests/test_workspace_drag.mjs
          node tests/test_grouped_actions.mjs
          git diff --check

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/fdm942-implement.yml scripts/fdm942_apply.py scripts/fdm942_prepatch.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: enforce FDM-942 session movement pins centrally'
          git push origin HEAD:feature/fdm-938-context-menus-local-grouping-workspace-pins

  headless:
    name: Headless CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out exact tested SHA
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact-SHA evidence
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'base=%s\nhead=%s\n' "$BASE_SHA" "$actual_sha"
          {
            echo '### Exact-SHA evidence'
            echo "- base: \`$BASE_SHA\`"
            echo "- head: \`$actual_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install headless test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick \
            qml6-module-qtquick-window \
            qml6-module-qttest \
            qt6-declarative-dev-tools \
            ripgrep

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in install.sh uninstall.sh scripts/smartdock scripts/run tests/check_*.sh; do
            bash -n "$script"
          done

      - name: Run structural guards
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for test_script in tests/check_*.sh; do
            echo "::group::$test_script"
            if ! bash "$test_script"; then
              status=1
            fi
            echo '::endgroup::'
          done
          exit "$status"

      - name: Run JavaScript model tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          for test_script in tests/test_*.mjs; do
            node "$test_script"
          done

      - name: Run Python model tests
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run browser provider tests
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 -m unittest discover -s provider/browser-profiles/tests -p 'test_*.py'

      - name: Run pure QML tests
        if: ${{ !cancelled() }}
        shell: bash
        run: /usr/lib/qt6/bin/qmltestrunner -input tests -import components

      - name: Check final diff whitespace
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]] && [[ ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi