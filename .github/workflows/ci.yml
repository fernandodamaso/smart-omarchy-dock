name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-fdm941:
    name: Apply FDM-941 source integration
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/fdm-938-context-menus-local-grouping-workspace-pins' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply CM-03 integration patch
        run: python3 scripts/fdm941_apply.py
      - name: Commit integration and remove one-shot scaffolding
        run: |
          set -euo pipefail
          rm scripts/fdm941_apply.py .github/workflows/fdm941-apply.yml
          git show b38818a84fb89f25c239a7b28fdaabb42a0700d6:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: wire FDM-941 workspace-local grouping'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  headless:
    name: Headless CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out exact tested SHA
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact-SHA evidence
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'base=%s\nhead=%s\n' "$BASE_SHA" "$actual_sha"
          {
            echo '### Exact-SHA evidence'
            echo "- base: \`$BASE_SHA\`"
            echo "- head: \`$actual_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install headless test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick \
            qml6-module-qtquick-window \
            qml6-module-qttest \
            qt6-declarative-dev-tools \
            ripgrep

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in install.sh uninstall.sh scripts/smartdock scripts/run tests/check_*.sh; do
            bash -n "$script"
          done

      - name: Run structural guards
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for test_script in tests/check_*.sh; do
            echo "::group::$test_script"
            if ! bash "$test_script"; then
              status=1
            fi
            echo '::endgroup::'
          done
          exit "$status"

      - name: Run JavaScript model tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          for test_script in tests/test_*.mjs; do
            node "$test_script"
          done

      - name: Run Python model tests
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run browser provider tests
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 -m unittest discover -s provider/browser-profiles/tests -p 'test_*.py'

      - name: Run pure QML tests
        if: ${{ !cancelled() }}
        shell: bash
        run: /usr/lib/qt6/bin/qmltestrunner -input tests -import components

      - name: Check final diff whitespace
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]] && [[ ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
