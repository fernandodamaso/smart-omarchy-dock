name: FDM-997 staging
on:
  push:
    branches: [agent/fdm-997-staging]
permissions:
  contents: write
concurrency:
  group: fdm-997-staging
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          path: stage
      - uses: actions/checkout@v5
        with:
          ref: 22ed8f26ffbc531de8470c49528454e16be4be35
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@v5
        with:
          repository: omacom/omarchy
          ref: 28ceaae70ebac3a0edcc21f2faa77a90dc6d404c
          path: native
      - name: Install Qt test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-dialogs qml6-module-qtquick-templates qml6-module-qtquick-layouts qml6-module-qtquick-shapes qml6-module-qt5compat-graphicaleffects qml6-module-qttest libqt6svg6 qt6-image-formats-plugins qt6-declarative-dev-tools ripgrep
      - name: Verify originals and native target
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 22ed8f26ffbc531de8470c49528454e16be4be35
          git checkout c660325bf437e4330b00f12cdd2beb3679d79ab9 -- docs/plans/2026-09-23-sidebar-widget-split-scroll.md docs/widget-gallery/reference/sidebar-redesign-2026-09-23 docs/widget-gallery/README.md
          git diff --cached --stat
          git ls-tree -r c660325bf437e4330b00f12cdd2beb3679d79ab9 docs/widget-gallery/reference/sidebar-redesign-2026-09-23
          echo '--- Native target ---'
          git -C ../native rev-parse HEAD
          cat ../native/version
          dpkg-query -W libqt6core6t64 qt6-declarative-dev-tools
          echo '--- Native first-party callers ---'
          rg -n -C 5 'PanelSectionHeader|Ui.Button' ../native/shell/plugins/network | head -200 || true
          echo '--- Test-native primitives ---'
          cat tests/qml-imports/qs/Ui/Button.qml
          cat tests/qml-imports/qs/Ui/qmldir
          echo '--- Sidebar chrome sources ---'
          rg -n -C 4 'workspaceCardInset|monitorFill|workspaceHoverFill|cardRadius|DockSidebarWidgetArea|pinnedStrip' components/DockSidebar.qml components/DockSidebarAppearance.qml
          echo '--- Visual reference rules ---'
          rg -n -C 3 'grip|w-head|w-header|badge|WIDGETS|PINNED' docs/widget-gallery/reference/sidebar-redesign-2026-09-23/source/Main.dc.html | head -180 || true
      - name: Execute staged checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        working-directory: candidate
        run: |
          set -euo pipefail
          if test -f ../stage/.agent/fdm997.py; then
            python3 ../stage/.agent/fdm997.py
          else
            node tests/test_sidebar_widgets.mjs
            node tests/test_widgetkit_structure.mjs
            /usr/lib/qt6/bin/qmltestrunner -input tests -import components -import tests/qml-imports
          fi
      - name: Keep checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdm-997-staging-evidence
          path: |
            candidate/.fdm997-evidence/
          if-no-files-found: ignore
