name: FDM-808 recovery patcher

on:
  push:
    branches: [recovery/fdm-808-window-cycling]
    paths:
      - .github/fdm808_apply.py
      - .github/workflows/fdm808-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: recovery/fdm-808-window-cycling
      - name: Apply exact recovery patch
        run: python3 .github/fdm808_apply.py
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DockHost.qml config/dock.json README.md components tests/check_pointer_actions.sh
          git diff --cached --check
          git commit -m 'feat: replay FDM-808 grouped window cycling'
          git push origin HEAD:recovery/fdm-808-window-cycling
