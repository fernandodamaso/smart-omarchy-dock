name: FDM-994 source snapshot

on:
  push:
    branches: [feat/sidebar-drag-feedback]
    paths: [.github/workflows/fdm-994-source-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 51de331db28ebd17406c3ed02b9138df6c1e1b7e
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz -o /tmp/smartdock-base.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: fdm-994-source-51de331
          path: /tmp/smartdock-base.tar.gz
          retention-days: 1
