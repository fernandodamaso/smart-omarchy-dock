name: FDM-994 candidate source qualification
on:
  push:
    branches: [feat/sidebar-drag-feedback]
    paths: ['.fdm-994-stage/**', '.github/workflows/fdm-994-stage.yml']
permissions:
  contents: write
jobs:
  qualify:
    if: github.repository == 'fernandodamaso/smart-omarchy-dock'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_TREE: ad8e63739004d8b5c0e411df914eea24edaae26e
      QT_QPA_PLATFORM: offscreen
      QML_XHR_ALLOW_FILE_READ: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct and verify exact source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/sidebar-drag-feedback
          git merge-base --is-ancestor 51de331db28ebd17406c3ed02b9138df6c1e1b7e HEAD
          python3 - <<'PY'
          import hashlib, lzma, pathlib, subprocess
          paths = subprocess.check_output(['git','diff','--name-only','51de331db28ebd17406c3ed02b9138df6c1e1b7e','HEAD'], text=True).splitlines()
          allowed = {'.github/workflows/fdm-994-source-snapshot.yml','.github/workflows/fdm-994-stage.yml'} | {f'.fdm-994-stage/part-{n}.xz' for n in range(1,6)}
          assert set(paths) <= allowed, paths
          raw = b''.join(pathlib.Path(f'.fdm-994-stage/part-{n}.xz').read_bytes() for n in range(1,6))
          patch = lzma.decompress(raw)
          assert hashlib.sha256(patch).hexdigest() == '8525b22a3f831c89e47845f74f2866be9ac097e4706587c3a5bcb237c0140b9b'
          pathlib.Path('/tmp/fdm994.patch').write_bytes(patch)
          PY
          git rm -r .fdm-994-stage .github/workflows/fdm-994-stage.yml .github/workflows/fdm-994-source-snapshot.yml
          git apply --index /tmp/fdm994.patch
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --stat > /tmp/fdm994-diff.txt
      - name: Publish verified Git objects only (no ref updates)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          repo='repos/fernandodamaso/smart-omarchy-dock/git/'
          def api(endpoint,payload):
            return json.loads(subprocess.check_output(['gh','api','--method','POST',repo+endpoint,'--input','-'], input=json.dumps(payload).encode()))
          changed=subprocess.check_output(['git','diff','--cached','--name-only','-z','HEAD']).decode().split('\0')
          entries=[]
          for path in filter(None,changed):
            staged=subprocess.check_output(['git','ls-files','--stage','--',path],text=True).strip()
            if not staged:
              entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
              continue
            mode,sha,_=staged.split()[:3]
            data=subprocess.check_output(['git','show',':'+path])
            blob=api('blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})
            assert blob['sha']==sha, path
            entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          tree=api('trees',{'base_tree':base_tree,'tree':entries})
          assert tree['sha']==os.environ['EXPECTED_TREE'],tree['sha']
          manifest={'tree':tree['sha'],'staging_head':os.environ['GITHUB_SHA'],'base':'51de331db28ebd17406c3ed02b9138df6c1e1b7e','ref_updated':False}
          pathlib.Path('/tmp/fdm994-tree.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - name: Install Qt test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-dialogs qml6-module-qtquick-templates qml6-module-qtquick-layouts qml6-module-qt5compat-graphicaleffects qml6-module-qttest libqt6svg6 qt6-image-formats-plugins qt6-declarative-dev-tools ripgrep
      - name: Run actual queued Qt tests
        shell: bash
        run: |
          set -euo pipefail
          /usr/lib/qt6/bin/qmltestrunner -input tests -import components -import tests/qml-imports 2>&1 | tee /tmp/fdm994-qml.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdm994-source-qualification
          path: |
            /tmp/fdm994-tree.json
            /tmp/fdm994-qml.log
            /tmp/fdm994-diff.txt
          retention-days: 1
