            if (root.representedWorkspaceGrouped()) {
''')

          replace_once(path,
          '''        valid && String(target ? target.address : "") !== ""
                  && workspace !== currentWorkspace,
''',
          '''        valid && String(target ? target.address : "") !== ""
                  && workspace !== currentWorkspace
