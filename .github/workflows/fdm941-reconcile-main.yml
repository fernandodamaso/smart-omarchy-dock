name: FDM-941 reconcile main

on:
  push:
    branches:
      - feature/fdm-938-context-menus-local-grouping-workspace-pins
    paths:
      - .github/workflows/fdm941-reconcile-main.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/fdm-938-context-menus-local-grouping-workspace-pins
          fetch-depth: 0
      - name: Merge current main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "02ee9ee6eb11d8b3d5991617081454d9170295e3"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff origin/main
          rm .github/workflows/fdm941-reconcile-main.yml
          git add -A
          git diff --cached --check
          git commit -m 'merge: reconcile FDM-948 main into FDM-938 feature'
          git push origin HEAD:feature/fdm-938-context-menus-local-grouping-workspace-pins
