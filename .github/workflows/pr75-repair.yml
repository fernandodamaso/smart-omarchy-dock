name: PR 75 Repair

on:
  push:
    branches: [feat/workspace-drag-consolidated]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/workspace-drag-consolidated
          fetch-depth: 0

      - name: Apply reviewed PR fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              expected = 1 if count is None else count
              if found != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {found}: {old!r}")
              p.write_text(text.replace(old, new))

          release_old = '      if (point.state === Qt.TouchPointReleased)'
          release_new = ('      // QEventPoint::Released maps to Qt::TouchPointReleased (0x08).\n'
                         '      if (point.state === 0x08)')
          replace('components/DockItem.qml', release_old, release_new)
          replace('components/DockWorkspaceGroup.qml', release_old, release_new)

          replace('components/DockWorkspaceMonitorDrag.qml',
                  '  property QtObject ghostImage: null',
                  '  property var ghostImage: null')
          replace('tests/runtime/workspace-drag-preview/PreviewDrag.qml',
                  '  property QtObject ghostImage: null',
                  '  property var ghostImage: null')

          replace('tests/tst_workspace_drag_preview.qml',
                  '    compare(scene.drag.ghostImage, null)',
                  '    compare(scene.drag.ghostUrl, "")', count=2)
          replace('tests/tst_workspace_drag_preview.qml',
                  '    verify(scene.drag.ghostImage !== null)',
                  '    verify(scene.drag.ghostUrl !== "")')

          replace('tests/test_workspace_drag.mjs',
                  "for (const [transition, state, expected] of [[1, 1, 'finish'], [1, 0, 'cancel'],\n    [2, 1, 'cancel'], [3, 1, 'cancel']])",
                  "for (const [transition, state, expected] of [[1, 0x08, 'finish'], [1, 0, 'cancel'],\n    [2, 0x08, 'cancel'], [3, 0x08, 'cancel']])")
          replace('tests/test_workspace_drag.mjs',
                  '      EventPoint: { Released: 1 }, workspaceMonitorDragDock: dock,',
                  '      workspaceMonitorDragDock: dock,')

          replace('tests/test_dev_session.py',
                  '        with mock.patch("dev_session._guard_hyprland_fds"):\n            with mock.patch("dev_session._owned_windows", return_value=heads):\n                with mock.patch("dev_session._place_owned_windows", return_value=heads):\n                    actual = _show_both_qemu_heads(9, "4", "visual-a")',
                  '        with mock.patch("dev_session._guard_hyprland_fds"):\n            with mock.patch("dev_session._host_command_json", return_value=heads):\n                with mock.patch("dev_session._owned_windows", return_value=heads):\n                    with mock.patch("dev_session._place_owned_windows", return_value=heads):\n                        actual = _show_both_qemu_heads(9, "4", "visual-a")')

          doc = Path('docs/WORKSPACE_DRAG_CONSOLIDATION.md')
          if doc.exists():
              text = doc.read_text()
              bad = 'c0f5098ec03ef1da1006dbed8e30d44a8366dbed8e30d44b9e8ca81880969379ff77e9cc4bd8'
              good = 'c0f5098ec03ef1da1006dbed8e30d44a836b9e8ca81880969379ff77e9cc4bd8'
              if bad in text:
                  doc.write_text(text.replace(bad, good))
          PY

          git diff --check
          git diff --exit-code -- .github/workflows/pr75-repair.yml || true

      - name: Commit repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/DockItem.qml components/DockWorkspaceGroup.qml \
            components/DockWorkspaceMonitorDrag.qml \
            tests/runtime/workspace-drag-preview/PreviewDrag.qml \
            tests/tst_workspace_drag_preview.qml tests/test_workspace_drag.mjs \
            tests/test_dev_session.py docs/WORKSPACE_DRAG_CONSOLIDATION.md
          if git diff --cached --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git commit -m 'fix: harden workspace drag CI compatibility'
          git push origin HEAD:feat/workspace-drag-consolidated
